<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Design Lab — The Internet Laboratory</title>
  <style>
    @font-face {
      font-family: 'Pangolin';
      src: url('../../assets/fonts/pangolin.ttf') format('truetype');
      font-display: swap;
    }
    @font-face {
      font-family: 'Walter Turncoat';
      src: url('../../assets/fonts/walter-turncoat.ttf') format('truetype');
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --paper:      #f4f0e8;
      --paper-dark: #e8e2d4;
      --ink:        #0e0c0a;
      --ink-dim:    #5a5248;
      --ink-faint:  #a89e90;
      --ink-press:  #1a1612;
      --rule:       rgba(14,12,10,0.12);
      --reg-red:    #c0392b;
      --reg-cyan:   #1a8a8a;
      --font-body:  'Pangolin', cursive;
      --font-sub:   'Walter Turncoat', cursive;
    }

    html, body {
      min-height: 100%;
      background: var(--paper);
      font-family: var(--font-body);
      overflow-x: hidden;
      color: var(--ink);
    }

    /* ── Paper texture — faint horizontal rules ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 23px,
        var(--rule) 23px,
        var(--rule) 24px
      );
      pointer-events: none;
      z-index: 0;
    }

    /* ── Crop marks — fixed corners ── */
    .crop-marks {
      position: fixed;
      inset: 1.5rem;
      pointer-events: none;
      z-index: 1;
    }
    .crop-marks::before,
    .crop-marks::after,
    .crop-tl, .crop-tr, .crop-bl, .crop-br {
      content: '';
      position: absolute;
      background: transparent;
    }
    /* TL */
    .crop-tl::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 18px; height: 1px;
      background: rgba(14,12,10,0.25);
    }
    .crop-tl::after {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 1px; height: 18px;
      background: rgba(14,12,10,0.25);
    }
    .crop-tr::before {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 18px; height: 1px;
      background: rgba(14,12,10,0.25);
    }
    .crop-tr::after {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 1px; height: 18px;
      background: rgba(14,12,10,0.25);
    }
    .crop-bl::before {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 18px; height: 1px;
      background: rgba(14,12,10,0.25);
    }
    .crop-bl::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 1px; height: 18px;
      background: rgba(14,12,10,0.25);
    }
    .crop-br::before {
      content: '';
      position: absolute;
      bottom: 0; right: 0;
      width: 18px; height: 1px;
      background: rgba(14,12,10,0.25);
    }
    .crop-br::after {
      content: '';
      position: absolute;
      bottom: 0; right: 0;
      width: 1px; height: 18px;
      background: rgba(14,12,10,0.25);
    }

    /* ── Registration marks ── */
    .reg-mark {
      position: fixed;
      pointer-events: none;
      z-index: 1;
    }
    .reg-mark svg { display: block; }
    .reg-tl { top: 1.2rem;  left: 1.2rem;  }
    .reg-tr { top: 1.2rem;  right: 1.2rem; }
    .reg-bl { bottom: 1.2rem; left: 1.2rem; }
    .reg-br { bottom: 1.2rem; right: 1.2rem; }

    /* ── Back link ── */
    .back-link {
      position: fixed;
      top: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-body);
      font-size: 0.55rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ink-faint);
      text-decoration: none;
      z-index: 100;
      transition: color 0.15s;
      white-space: nowrap;
    }
    .back-link:hover { color: var(--ink); }

    /* ── Page ── */
    .page {
      position: relative;
      z-index: 2;
      max-width: 700px;
      margin: 0 auto;
      padding: 5rem 1.5rem 6rem;
    }

    /* ── Specimen header ── */
    .specimen-header {
      margin-bottom: 3rem;
      opacity: 0;
      animation: fadeIn 0.5s ease 0.2s forwards;
    }

    .spec-meta {
      font-family: monospace;
      font-size: 0.48rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .spec-meta-rule {
      flex: 1;
      height: 1px;
      background: var(--rule);
    }

    /* Big display type — the specimen ── */
    .specimen-title {
      font-family: var(--font-sub);
      font-size: clamp(2.8rem, 10vw, 5.5rem);
      font-weight: 400;
      line-height: 0.95;
      color: var(--ink-press);
      letter-spacing: -0.01em;
      position: relative;
      display: inline-block;
    }

    /* Ink smear — offset layers */
    .specimen-title::before {
      content: attr(data-text);
      position: absolute;
      top: 1px; left: 2px;
      color: var(--reg-cyan);
      opacity: 0.18;
      pointer-events: none;
    }
    .specimen-title::after {
      content: attr(data-text);
      position: absolute;
      top: -1px; left: -1px;
      color: var(--reg-red);
      opacity: 0.12;
      pointer-events: none;
    }

    .specimen-subtitle {
      font-family: monospace;
      font-size: 0.58rem;
      color: var(--ink-dim);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-top: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .specimen-subtitle::before {
      content: '';
      width: 24px; height: 1px;
      background: var(--ink-dim);
    }

    /* ── Divider rule with registration ── */
    .press-rule {
      height: 3px;
      background: var(--ink);
      margin: 0 0 0.25rem;
      opacity: 0;
      animation: fadeIn 0.4s ease 0.35s forwards;
    }
    .press-rule-thin {
      height: 1px;
      background: var(--ink);
      margin-bottom: 2rem;
      opacity: 0;
      animation: fadeIn 0.4s ease 0.4s forwards;
    }

    /* ── Proof grid ── */
    .proof-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
      border: 1px solid var(--ink);
      border-bottom: none;
    }

    /* ── Proof item — each project as a type proof ── */
    .proof-item {
      border-bottom: 1px solid var(--ink);
      padding: 1.1rem 1rem 1rem;
      position: relative;
      cursor: default;
      opacity: 0;
      animation: fadeIn 0.4s ease forwards;
      transition: background 0.1s;
      text-decoration: none;
      color: inherit;
      display: block;
    }
    .proof-item:nth-child(1) { animation-delay: 0.5s; }
    .proof-item:nth-child(2) { animation-delay: 0.6s; }
    .proof-item:nth-child(3) { animation-delay: 0.7s; }
    .proof-item:nth-child(4) { animation-delay: 0.8s; }
    .proof-item:nth-child(5) { animation-delay: 0.9s; }
    .proof-item:nth-child(6) { animation-delay: 1.0s; }

    .proof-item:hover { background: var(--paper-dark); }

    /* Left gutter — proof number printed large */
    .proof-num {
      position: absolute;
      top: 0.8rem;
      right: 0.8rem;
      font-family: monospace;
      font-size: 2.5rem;
      color: var(--ink);
      opacity: 0.04;
      line-height: 1;
      pointer-events: none;
      font-weight: bold;
    }

    .proof-tag {
      font-family: monospace;
      font-size: 0.44rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Colour swatch — top border signal */
    .proof-item:nth-child(1) { border-left: 3px solid #b5717a; }
    .proof-item:nth-child(2) { border-left: 3px solid #5a7a9f; }
    .proof-item:nth-child(3) { border-left: 3px solid #b8913a; }
    .proof-item:nth-child(4) { border-left: 3px solid #a85c45; }
    .proof-item:nth-child(5) { border-left: 3px solid #6a8f6e; }
    .proof-item:nth-child(6) { border-left: 3px solid #5a7a5a; }

    .proof-title {
      font-family: var(--font-sub);
      font-size: 1.1rem;
      color: var(--ink-press);
      line-height: 1.2;
      margin-bottom: 0.35rem;
    }

    .proof-desc {
      font-size: 0.65rem;
      color: var(--ink-dim);
      line-height: 1.55;
      max-width: 46ch;
    }

    .proof-footer {
      margin-top: 0.6rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .proof-status {
      font-family: monospace;
      font-size: 0.42rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 0.15em 0.55em;
      border: 1px solid var(--ink-faint);
      color: var(--ink-faint);
    }
    .proof-status.running {
      border-color: var(--ink-dim);
      color: var(--ink-dim);
    }
    .proof-status.abandoned {
      text-decoration: line-through;
    }

    .proof-arrow {
      font-size: 0.7rem;
      color: var(--ink-faint);
      opacity: 0;
      transition: opacity 0.1s, transform 0.1s;
    }
    .proof-item:hover .proof-arrow { opacity: 1; transform: translate(2px,-2px); }

    /* ── Ink roller smear ── */
    .ink-smear {
      height: 6px;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(14,12,10,0.08) 10%,
        rgba(14,12,10,0.14) 30%,
        rgba(14,12,10,0.06) 70%,
        rgba(14,12,10,0.11) 85%,
        transparent 100%
      );
      margin: 1.5rem 0;
      opacity: 0;
      animation: fadeIn 0.5s ease 1.1s forwards;
      position: relative;
    }
    /* second thinner pass */
    .ink-smear::after {
      content: '';
      position: absolute;
      top: 8px;
      left: 5%;
      right: 8%;
      height: 2px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(14,12,10,0.06) 20%,
        rgba(14,12,10,0.09) 60%,
        transparent
      );
    }

    /* ── Colophon ── */
    .colophon {
      opacity: 0;
      animation: fadeIn 0.5s ease 1.2s forwards;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      border: 1px solid var(--ink);
      font-family: monospace;
      font-size: 0.44rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .colophon-cell {
      padding: 0.55rem 0.75rem;
      border-right: 1px solid var(--ink);
      border-bottom: 1px solid var(--ink);
      color: var(--ink-faint);
      line-height: 1.6;
    }
    .colophon-cell:nth-child(even) { border-right: none; }
    .colophon-cell:nth-last-child(-n+2) { border-bottom: none; }
    .colophon-cell strong {
      display: block;
      color: var(--ink-dim);
      font-weight: normal;
    }

    /* ── Animations ── */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<!-- Crop marks -->
<div class="crop-marks">
  <div class="crop-tl"></div>
  <div class="crop-tr"></div>
  <div class="crop-bl"></div>
  <div class="crop-br"></div>
</div>

<!-- Registration marks -->
<div class="reg-mark reg-tl">
  <svg width="16" height="16" viewBox="0 0 16 16">
    <circle cx="8" cy="8" r="6" fill="none" stroke="rgba(192,57,43,0.35)" stroke-width="0.8"/>

  </svg>
</div>
<div class="reg-mark reg-tr">
  <svg width="16" height="16" viewBox="0 0 16 16">
    <circle cx="8" cy="8" r="6" fill="none" stroke="rgba(26,138,138,0.35)" stroke-width="0.8"/>
    <line x1="8" y1="0" x2="8" y2="16" stroke="rgba(26,138,138,0.35)" stroke-width="0.8"/>
    <line x1="0" y1="8" x2="16" y2="8" stroke="rgba(26,138,138,0.35)" stroke-width="0.8"/>
  </svg>
</div>
<div class="reg-mark reg-bl">
  <svg width="16" height="16" viewBox="0 0 16 16">
    <circle cx="8" cy="8" r="6" fill="none" stroke="rgba(192,57,43,0.25)" stroke-width="0.8"/>
    <line x1="8" y1="0" x2="8" y2="16" stroke="rgba(192,57,43,0.25)" stroke-width="0.8"/>
    <line x1="0" y1="8" x2="16" y2="8" stroke="rgba(192,57,43,0.25)" stroke-width="0.8"/>
  </svg>
</div>
<div class="reg-mark reg-br">
  <svg width="16" height="16" viewBox="0 0 16 16">
    <circle cx="8" cy="8" r="6" fill="none" stroke="rgba(26,138,138,0.25)" stroke-width="0.8"/>
    <line x1="8" y1="0" x2="8" y2="16" stroke="rgba(26,138,138,0.25)" stroke-width="0.8"/>
    <line x1="0" y1="8" x2="16" y2="8" stroke="rgba(26,138,138,0.25)" stroke-width="0.8"/>
  </svg>
</div>

<a class="back-link" href="../../index.html">← The Laboratory</a>

<div class="page">

  <!-- Specimen header -->
  <header class="specimen-header">
    <div class="spec-meta">
      INLT &nbsp;·&nbsp; SECTION 04 &nbsp;·&nbsp; DESIGN LAB
      <span class="spec-meta-rule"></span>
      PROOF SHEET
    </div>
    <h1 class="specimen-title" data-text="Design Lab">Design Lab</h1>
    <p class="specimen-subtitle">Typography · Visual systems · Interface experiments</p>
  </header>

  <div class="press-rule"></div>
  <div class="press-rule-thin"></div>

  <!-- Proof grid -->
  <div class="proof-grid" id="proofGrid"></div>

  <!-- Ink roller smear -->
  <div class="ink-smear"></div>

  <!-- Colophon -->
  <div class="colophon">
    <div class="colophon-cell">
      section<br>
      <strong>Design Lab</strong>
    </div>
    <div class="colophon-cell">
      items<br>
      <strong id="colTotal">—</strong>
    </div>
    <div class="colophon-cell">
      status<br>
      <strong>wip — mostly</strong>
    </div>
    <div class="colophon-cell">
      purpose<br>
      <strong>no commercial application</strong>
    </div>
  </div>

</div>

<script>
// ═══════════════════════════════════════════════
//  DESIGN LAB REGISTRY
// ═══════════════════════════════════════════════
const PIECES = [
  {
    id: 'DL-001',
    title: 'Specimen 001',
    desc: 'A typographic exploration. Something about scale and contrast. Details pending.',
    status: 'wip',
    slug: null,
  },
  {
    id: 'DL-002',
    title: 'Specimen 002',
    desc: 'Visual system in progress. Rules established. Application unclear.',
    status: 'wip',
    slug: null,
  },
  {
    id: 'DL-003',
    title: 'Specimen 003',
    desc: 'Interface experiment with no intended user. Running anyway.',
    status: 'wip',
    slug: null,
  },
  {
    id: 'DL-004',
    title: 'Specimen 004',
    desc: 'Colour study. Possibly complete. Possibly abandoned. Undecided.',
    status: 'wip',
    slug: null,
  },
  {
    id: 'DL-005',
    title: 'Specimen 005',
    desc: 'Layout logic for a grid system nobody requested.',
    status: 'wip',
    slug: null,
  },
  {
    id: 'DL-006',
    title: 'Specimen 006',
    desc: 'Reserved. Something will go here eventually.',
    status: 'wip',
    slug: null,
  },
];

// ═══════════════════════════════════════════════
//  RENDER PROOF ITEMS
// ═══════════════════════════════════════════════
const grid = document.getElementById('proofGrid');

PIECES.forEach((piece, i) => {
  const el = document.createElement(piece.slug ? 'a' : 'div');
  if (piece.slug) el.href = `./${piece.slug}/index.html`;
  el.className = 'proof-item';

  el.innerHTML = `
    <div class="proof-num">${String(i + 1).padStart(2, '0')}</div>
    <div class="proof-tag">
      ${piece.id}
      <span style="flex:1;height:1px;background:rgba(14,12,10,0.1);display:inline-block;"></span>
    </div>
    <div class="proof-title">${piece.title}</div>
    <p class="proof-desc">${piece.desc}</p>
    <div class="proof-footer">
      <span class="proof-status ${piece.status}">${piece.status}</span>
      ${piece.slug ? '<span class="proof-arrow">↗</span>' : ''}
    </div>
  `;

  grid.appendChild(el);
});

document.getElementById('colTotal').textContent = PIECES.length;
</script>
</body>
