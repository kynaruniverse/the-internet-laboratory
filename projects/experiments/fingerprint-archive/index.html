<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fingerprint Archive — The Internet Laboratory</title>
  <style>
    @font-face {
      font-family: 'Pangolin';
      src: url('../../../assets/fonts/pangolin.ttf') format('truetype');
      font-display: swap;
    }
    @font-face {
      font-family: 'Walter Turncoat';
      src: url('../../../assets/fonts/walter-turncoat.ttf') format('truetype');
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0f11;
      --surface: #141618;
      --border: #1e2024;
      --text-dim: #3a3f48;
      --text-mid: #6a7080;
      --font-body: 'Pangolin', cursive;
      --font-sub: 'Walter Turncoat', cursive;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      overflow: hidden;
      font-family: var(--font-body);
      color: var(--text-mid);
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── Canvas ── */
    #smudge-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    /* ── Back link ── */
    .back-link {
      position: fixed;
      top: 1.25rem;
      left: 1.25rem;
      font-family: var(--font-body);
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-dim);
      text-decoration: none;
      z-index: 10;
      transition: color 0.15s;
    }
    .back-link:hover { color: var(--text-mid); }

    /* ── Legend ── */
    .legend {
      position: fixed;
      bottom: 1.25rem;
      left: 1.25rem;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .legend.visible { opacity: 1; }
    .legend-title {
      font-family: var(--font-sub);
      font-size: 0.7rem;
      color: var(--text-dim);
      letter-spacing: 0.05em;
    }
    .legend-days {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      max-width: 12rem;
    }
    .legend-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      opacity: 0.7;
    }
    .legend-count {
      font-family: var(--font-body);
      font-size: 0.55rem;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      margin-top: 0.2rem;
    }

    /* ── Tap hint ── */
    .tap-hint {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      font-family: var(--font-body);
      font-size: 0.55rem;
      letter-spacing: 0.12em;
      color: var(--text-dim);
      pointer-events: none;
      z-index: 10;
      text-align: right;
    }

    /* ── Loading state ── */
    .loading {
      position: fixed;
      bottom: 1.25rem;
      right: 1.25rem;
      font-family: var(--font-body);
      font-size: 0.55rem;
      color: var(--text-dim);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      z-index: 10;
      transition: opacity 0.4s;
    }
    .loading.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>

  <a class="back-link" href="../../../index.html">← The Laboratory</a>

  <canvas id="smudge-canvas"></canvas>

  <div class="tap-hint" id="tapHint">// tap to leave a trace &nbsp;·&nbsp; <span id="tapCount">40</span> remaining</div>

  <div class="legend" id="legend">
    <div class="legend-title">// archive</div>
    <div class="legend-days" id="legendDays"></div>
    <div class="legend-count" id="legendCount"></div>
  </div>

  <div class="loading" id="loading">Loading archive…</div>

  <script>
    // ── 14-colour palette — 2 per weekday
    const DAY_COLOURS = [
      '#7a9e8a', '#4a7a6a', // Mon
      '#8a7a9e', '#5a4a7a', // Tue
      '#9e8a7a', '#7a5a4a', // Wed
      '#7a8a9e', '#4a5a7a', // Thu
      '#9e9a7a', '#7a6a4a', // Fri
      '#9e7a7a', '#7a4a4a', // Sat
      '#7a9e9e', '#4a7a7a', // Sun
    ];

    function getTodayColour() {
      const now = new Date();
      const day = now.getDay(); // 0=Sun, 1=Mon ... 6=Sat
      // Remap: Sun=6, Mon=0, Tue=1 ... Sat=5 (pairs start at Mon)
      const remap = [6, 0, 2, 4, 6, 8, 10][day];
      // Week parity — odd ISO week = slot 1
      const jan1 = new Date(now.getFullYear(), 0, 1);
      const weekNum = Math.ceil(((now - jan1) / 86400000 + jan1.getDay() + 1) / 7);
      const slot = weekNum % 2 === 0 ? 0 : 1;
      return DAY_COLOURS[[0,2,4,6,8,10,12][day === 0 ? 6 : day - 1] + slot];
    }

    // ── Canvas setup
    const canvas = document.getElementById('smudge-canvas');
    const ctx    = canvas.getContext('2d');
    let W, H;

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
      redrawAll();
    }
    window.addEventListener('resize', resize);

    // ── Smudge store
    let smudges     = [];
    let todayColour = getTodayColour();
    let firstTouch  = false;
    let sessionTaps = 0;
    const SESSION_LIMIT = 40;

    // ── Draw one smudge
    function drawSmudge(s) {
      const px = s.x * W;
      const py = s.y * H;
      const r  = s.size || 32;

      ctx.save();
      ctx.translate(px, py);
      ctx.scale(1, 0.75);

      // Base glow
      const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
      grad.addColorStop(0,   hexAlpha(s.color, 0.18));
      grad.addColorStop(0.5, hexAlpha(s.color, 0.09));
      grad.addColorStop(1,   hexAlpha(s.color, 0));
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();

      // Ridge rings — concentric ovals at low opacity
      const rings = 5;
      ctx.strokeStyle = hexAlpha(s.color, 0.06);
      ctx.lineWidth = 1.2;
      for (let i = 1; i <= rings; i++) {
        const rr = (r * 0.85) * (i / rings);
        ctx.beginPath();
        ctx.ellipse(0, 0, rr, rr * 0.78, 0, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Slight smear offset — no print is perfectly round
      ctx.globalAlpha = 0.04;
      ctx.fillStyle = hexAlpha(s.color, 1);
      ctx.beginPath();
      ctx.ellipse(r * 0.12, r * 0.08, r * 0.55, r * 0.38, 0.3, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function redrawAll() {
      ctx.clearRect(0, 0, W, H);
      smudges.forEach(drawSmudge);
    }

    function hexAlpha(hex, alpha) {
      const r = parseInt(hex.slice(1,3),16);
      const g = parseInt(hex.slice(3,5),16);
      const b = parseInt(hex.slice(5,7),16);
      return `rgba(${r},${g},${b},${alpha})`;
    }

    // ── Legend
    function updateLegend() {
      const seen = {};
      smudges.forEach(s => { seen[s.color] = true; });
      const colours = Object.keys(seen);
      const days    = document.getElementById('legendDays');
      const count   = document.getElementById('legendCount');
      const legend  = document.getElementById('legend');

      days.innerHTML = colours.map(c =>
        `<div class="legend-dot" style="background:${c}"></div>`
      ).join('');
      count.textContent = `${colours.length} colour${colours.length !== 1 ? 's' : ''} · ${smudges.length} touch${smudges.length !== 1 ? 'es' : ''}`;
      if (colours.length > 0) legend.classList.add('visible');
    }

    // ── API
    async function loadSmudges() {
      try {
        const res  = await fetch('/api/smudges');
        const data = await res.json();
        smudges = data.smudges || [];
        resize();
        updateLegend();
      } catch(e) {
        console.error('Load failed', e);
      } finally {
        document.getElementById('loading').classList.add('hidden');
      }
    }

    async function saveSmudge(s) {
      try {
        await fetch('/api/smudges', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(s)
        });
      } catch(e) {
        console.error('Save failed', e);
      }
    }

    // ── Interaction
    function addSmudge(clientX, clientY) {
      if (sessionTaps >= SESSION_LIMIT) return;
      sessionTaps++;
      const remaining = SESSION_LIMIT - sessionTaps;
      const countEl = document.getElementById('tapCount');
      if (countEl) countEl.textContent = remaining;
      if (remaining === 0 && countEl) {
        document.getElementById('tapHint').textContent = '// archive full for this session';
      }
      const size = 28 + Math.random() * 20;
      const s = {
        x:     clientX / W,
        y:     clientY / H,
        color: todayColour,
        size
      };
      smudges.push(s);
      drawSmudge(s);
      updateLegend();
      saveSmudge(s);
    }

    // Touch
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      Array.from(e.changedTouches).forEach(t => addSmudge(t.clientX, t.clientY));
    }, { passive: false });

    // Mouse
    canvas.addEventListener('mousedown', e => { addSmudge(e.clientX, e.clientY); });

    // ── Init
    resize();
    loadSmudges();
  </script>
</body>
</html>
