<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fakes — The Internet Laboratory</title>
  <style>
    @font-face {
      font-family: 'Pangolin';
      src: url('../../assets/fonts/pangolin.ttf') format('truetype');
      font-display: swap;
    }
    @font-face {
      font-family: 'Walter Turncoat';
      src: url('../../assets/fonts/walter-turncoat.ttf') format('truetype');
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #080a0f;
      --glass:     rgba(255,255,255,0.03);
      --glass-hi:  rgba(255,255,255,0.07);
      --border:    rgba(255,255,255,0.07);
      --border-hi: rgba(255,255,255,0.14);
      --text:      #e8e0d0;
      --text-dim:  #7a7268;
      --text-faint:#3a3830;
      --font-body: 'Pangolin', cursive;
      --font-sub:  'Walter Turncoat', cursive;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      font-family: var(--font-body);
      overflow-x: hidden;
      color: var(--text);
    }

    /* ── Rain canvas ── */
    #rain-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.35;
    }

    /* ── Neon flicker ambient ── */
    #neon-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Back link ── */
    .back-link {
      position: fixed;
      top: 1.25rem;
      left: 1.25rem;
      font-family: var(--font-body);
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-dim);
      text-decoration: none;
      z-index: 100;
      transition: color 0.15s;
    }
    .back-link:hover { color: var(--text); }

    /* ── Page ── */
    .page {
      position: relative;
      z-index: 2;
      max-width: 680px;
      margin: 0 auto;
      padding: 4.5rem 1.25rem 6rem;
    }

    /* ── Header ── */
    .page-header {
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeIn 0.6s ease 0.2s forwards;
    }

    .header-label {
      font-family: monospace;
      font-size: 0.52rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-faint);
      margin-bottom: 0.6rem;
    }

    .header-title {
      font-family: var(--font-sub);
      font-size: clamp(1.8rem, 7vw, 3rem);
      font-weight: 400;
      line-height: 1.1;
      /* neon pink-magenta */
      color: #ff4fa0;
      text-shadow:
        0 0 8px rgba(255,79,160,0.8),
        0 0 24px rgba(255,79,160,0.4),
        0 0 60px rgba(255,79,160,0.15);
      animation: neonFlicker 8s ease infinite;
    }

    .header-sub {
      font-size: 0.72rem;
      color: var(--text-dim);
      margin-top: 0.6rem;
      line-height: 1.6;
      font-family: var(--font-body);
    }

    /* ── Window frame ── */
    .window-frame {
      position: relative;
      border: 1px solid var(--border);
      background: var(--glass);
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: fadeIn 0.6s ease 0.4s forwards;
    }

    /* rain-streaked glass overlay */
    .window-frame::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        170deg,
        transparent,
        transparent 60px,
        rgba(255,255,255,0.012) 60px,
        rgba(255,255,255,0.012) 61px
      );
      pointer-events: none;
      z-index: 1;
    }

    .window-label {
      padding: 0.65rem 1rem;
      border-bottom: 1px solid var(--border);
      font-family: monospace;
      font-size: 0.5rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-faint);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .window-label-dot {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: #ff4fa0;
      box-shadow: 0 0 6px #ff4fa0;
      animation: pulse 2.2s ease infinite;
    }

    /* ── Product grid ── */
    .product-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1px;
      background: var(--border);
    }

    @media (min-width: 480px) {
      .product-grid { grid-template-columns: 1fr 1fr; }
    }

    /* ── Product card ── */
    .product-card {
      background: var(--bg);
      padding: 1.4rem 1.1rem 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      min-height: 10rem;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: background 0.15s;
    }

    .product-card:hover {
      background: var(--glass-hi);
    }

    /* neon top border per card */
    .product-card:nth-child(1) {
      border-top: 2px solid #ff4fa0;
      box-shadow: inset 0 2px 12px rgba(255,79,160,0.08);
    }
    .product-card:nth-child(2) {
      border-top: 2px solid #4fe0ff;
      box-shadow: inset 0 2px 12px rgba(79,224,255,0.08);
    }
    .product-card:nth-child(3) {
      border-top: 2px solid #a04fff;
      box-shadow: inset 0 2px 12px rgba(160,79,255,0.08);
    }
    .product-card:nth-child(4) {
      border-top: 2px solid #ff9f40;
      box-shadow: inset 0 2px 12px rgba(255,159,64,0.08);
    }
    .product-card:nth-child(5) {
      border-top: 2px solid #40ff9f;
      box-shadow: inset 0 2px 12px rgba(64,255,159,0.08);
    }
    .product-card:nth-child(6) {
      border-top: 2px solid #ff4fa0;
      box-shadow: inset 0 2px 12px rgba(255,79,160,0.08);
    }

    /* neon glow on hover per card */
    .product-card:nth-child(1):hover { box-shadow: inset 0 2px 24px rgba(255,79,160,0.14), 0 0 0 1px rgba(255,79,160,0.12); }
    .product-card:nth-child(2):hover { box-shadow: inset 0 2px 24px rgba(79,224,255,0.14), 0 0 0 1px rgba(79,224,255,0.12); }
    .product-card:nth-child(3):hover { box-shadow: inset 0 2px 24px rgba(160,79,255,0.14), 0 0 0 1px rgba(160,79,255,0.12); }
    .product-card:nth-child(4):hover { box-shadow: inset 0 2px 24px rgba(255,159,64,0.14), 0 0 0 1px rgba(255,159,64,0.12); }
    .product-card:nth-child(5):hover { box-shadow: inset 0 2px 24px rgba(64,255,159,0.14), 0 0 0 1px rgba(64,255,159,0.12); }
    .product-card:nth-child(6):hover { box-shadow: inset 0 2px 24px rgba(255,79,160,0.14), 0 0 0 1px rgba(255,79,160,0.12); }

    .card-num {
      font-family: monospace;
      font-size: 0.45rem;
      color: var(--text-faint);
      letter-spacing: 0.18em;
    }

    .card-name {
      font-family: var(--font-sub);
      font-size: 1.05rem;
      font-weight: 400;
      line-height: 1.2;
      color: var(--text);
    }

    .card-desc {
      font-size: 0.65rem;
      color: var(--text-dim);
      line-height: 1.55;
      flex: 1;
    }

    .card-status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
    }

    .card-badge {
      font-family: monospace;
      font-size: 0.44rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 0.2em 0.55em;
      border-radius: 2px;
    }
    .card-badge.wip {
      background: rgba(255,159,64,0.1);
      border: 1px solid rgba(255,159,64,0.25);
      color: #ff9f40;
    }
    .card-badge.running {
      background: rgba(64,255,159,0.1);
      border: 1px solid rgba(64,255,159,0.25);
      color: #40ff9f;
    }
    .card-badge.abandoned {
      background: rgba(120,120,120,0.1);
      border: 1px solid rgba(120,120,120,0.2);
      color: #888;
    }

    .card-arrow {
      font-size: 0.75rem;
      color: var(--text-faint);
      opacity: 0;
      transition: opacity 0.12s, transform 0.12s;
    }
    .product-card:hover .card-arrow {
      opacity: 1;
      transform: translate(2px, -2px);
    }

    /* ── Street reflection strip ── */
    .reflection {
      height: 3px;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255,79,160,0.4) 20%,
        rgba(79,224,255,0.4) 50%,
        rgba(160,79,255,0.3) 80%,
        transparent 100%
      );
      margin-bottom: 2rem;
      opacity: 0;
      animation: fadeIn 0.6s ease 0.6s forwards;
      filter: blur(1px);
    }

    /* ── Footer ── */
    .page-footer {
      opacity: 0;
      animation: fadeIn 0.6s ease 1s forwards;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    .footer-id {
      font-family: monospace;
      font-size: 0.45rem;
      color: var(--text-faint);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      line-height: 1.8;
    }

    .footer-neon {
      font-family: var(--font-sub);
      font-size: 0.7rem;
      color: #ff4fa0;
      text-shadow: 0 0 8px rgba(255,79,160,0.6);
      animation: neonFlicker 6s ease infinite 1s;
    }

    /* ── Animations ── */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.2; }
    }

    @keyframes neonFlicker {
      0%, 92%, 96%, 100% { opacity: 1; }
      93%                { opacity: 0.4; }
      94%                { opacity: 1; }
      95%                { opacity: 0.2; }
      97%                { opacity: 0.85; }
    }
  </style>
</head>
<body>

<canvas id="neon-canvas"></canvas>
<canvas id="rain-canvas"></canvas>

<a class="back-link" href="../../index.html">← The Laboratory</a>

<div class="page">

  <header class="page-header">
    <p class="header-label">// fakes &nbsp;·&nbsp; section 02</p>
    <h1 class="header-title">Fake Products</h1>
    <p class="header-sub">Startups that will never launch. Landing pages for things that don't exist. Built as if real.</p>
  </header>

  <div class="window-frame">
    <div class="window-label">
      <span>// display window &nbsp;·&nbsp; <span id="cardCount">0</span> products</span>
      <span class="window-label-dot"></span>
    </div>
    <div class="product-grid" id="productGrid"></div>
  </div>

  <div class="reflection"></div>

  <footer class="page-footer">
    <div class="footer-id">
      INLT &nbsp;·&nbsp; SECTION 02<br>
      FAKES &nbsp;·&nbsp; DISPLAY WINDOW<br>
      STATUS: <span style="color:#ff4fa0">OPEN</span>
    </div>
    <div class="footer-neon">OPEN 24H</div>
  </footer>

</div>

<script>
// ═══════════════════════════════════════════════
//  PRODUCT REGISTRY
// ═══════════════════════════════════════════════
const PRODUCTS = [
  {
    id: '001',
    title: 'Slot 01',
    desc: 'Something is being built here. Concept exists. Launch unlikely.',
    status: 'wip',
    slug: null,
  },
  {
    id: '002',
    title: 'Slot 02',
    desc: 'A startup for a problem nobody has reported having.',
    status: 'wip',
    slug: null,
  },
  {
    id: '003',
    title: 'Slot 03',
    desc: 'Landing page in progress. Product unclear. Vibes: strong.',
    status: 'wip',
    slug: null,
  },
  {
    id: '004',
    title: 'Slot 04',
    desc: 'Filed under: 2am ideas. Status: not reviewed in daylight.',
    status: 'wip',
    slug: null,
  },
  {
    id: '005',
    title: 'Slot 05',
    desc: 'Concept noted. Implementation deferred. Indefinitely.',
    status: 'wip',
    slug: null,
  },
  {
    id: '006',
    title: 'Slot 06',
    desc: 'Reserved for something that does not yet exist.',
    status: 'wip',
    slug: null,
  },
];

// ═══════════════════════════════════════════════
//  RENDER CARDS
// ═══════════════════════════════════════════════
const grid = document.getElementById('productGrid');
const countEl = document.getElementById('cardCount');
countEl.textContent = PRODUCTS.length;

PRODUCTS.forEach(p => {
  const card = document.createElement(p.slug ? 'a' : 'div');
  if (p.slug) card.href = `./${p.slug}/index.html`;
  card.className = 'product-card';
  card.innerHTML = `
    <div class="card-num">${p.id}</div>
    <div class="card-name">${p.title}</div>
    <p class="card-desc">${p.desc}</p>
    <div class="card-status-row">
      <span class="card-badge ${p.status}">${p.status}</span>
      ${p.slug ? '<span class="card-arrow">↗</span>' : ''}
    </div>
  `;
  grid.appendChild(card);
});

// ═══════════════════════════════════════════════
//  RAIN CANVAS
// ═══════════════════════════════════════════════
const rainCanvas = document.getElementById('rain-canvas');
const rCtx = rainCanvas.getContext('2d');
let RW, RH;
const drops = [];

function initRain() {
  RW = rainCanvas.width  = window.innerWidth;
  RH = rainCanvas.height = window.innerHeight;
  drops.length = 0;
  const count = Math.floor(RW / 6);
  for (let i = 0; i < count; i++) {
    drops.push({
      x:     Math.random() * RW,
      y:     Math.random() * RH,
      len:   8  + Math.random() * 18,
      speed: 6  + Math.random() * 10,
      opacity: 0.04 + Math.random() * 0.12,
      width: 0.5 + Math.random() * 0.8,
    });
  }
}

function drawRain() {
  requestAnimationFrame(drawRain);
  rCtx.clearRect(0, 0, RW, RH);
  for (const d of drops) {
    rCtx.beginPath();
    rCtx.moveTo(d.x, d.y);
    rCtx.lineTo(d.x - 1, d.y + d.len);
    rCtx.strokeStyle = `rgba(160,200,255,${d.opacity})`;
    rCtx.lineWidth   = d.width;
    rCtx.stroke();
    d.y += d.speed;
    if (d.y > RH) {
      d.y = -d.len;
      d.x = Math.random() * RW;
    }
  }
}

initRain();
drawRain();

// ═══════════════════════════════════════════════
//  NEON AMBIENT CANVAS
// ═══════════════════════════════════════════════
const neonCanvas = document.getElementById('neon-canvas');
const nCtx = neonCanvas.getContext('2d');
let NW, NH;

// Neon light sources — static positions, flickering intensity
const neonLights = [
  { x: 0.15, y: 0.1,  color: [255, 79,  160], radius: 0.35, phase: 0,    speed: 0.008 },
  { x: 0.75, y: 0.05, color: [79,  224, 255], radius: 0.3,  phase: 1.2,  speed: 0.011 },
  { x: 0.5,  y: 0.6,  color: [160, 79,  255], radius: 0.25, phase: 2.4,  speed: 0.007 },
  { x: 0.9,  y: 0.4,  color: [255, 159, 64],  radius: 0.2,  phase: 0.7,  speed: 0.013 },
];

// Flicker state — occasional dropout
const flickerState = neonLights.map(() => ({ dropout: false, timer: 0 }));

function initNeon() {
  NW = neonCanvas.width  = window.innerWidth;
  NH = neonCanvas.height = window.innerHeight;
}

function drawNeon() {
  requestAnimationFrame(drawNeon);
  nCtx.clearRect(0, 0, NW, NH);
  nCtx.fillStyle = '#080a0f';
  nCtx.fillRect(0, 0, NW, NH);

  neonLights.forEach((light, i) => {
    light.phase += light.speed;
    const fs = flickerState[i];

    // Random dropout
    fs.timer--;
    if (fs.timer <= 0) {
      fs.dropout = Math.random() < 0.04;
      fs.timer   = 20 + Math.floor(Math.random() * 80);
    }
    if (fs.dropout) return;

    const pulse   = Math.sin(light.phase) * 0.5 + 0.5;
    const alpha   = 0.06 + pulse * 0.08;
    const x       = light.x * NW;
    const y       = light.y * NH;
    const r       = light.radius * Math.min(NW, NH);
    const [cr, cg, cb] = light.color;

    const grad = nCtx.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0,   `rgba(${cr},${cg},${cb},${alpha})`);
    grad.addColorStop(0.5, `rgba(${cr},${cg},${cb},${alpha * 0.4})`);
    grad.addColorStop(1,   `rgba(${cr},${cg},${cb},0)`);

    nCtx.fillStyle = grad;
    nCtx.fillRect(0, 0, NW, NH);
  });
}

initNeon();
drawNeon();

window.addEventListener('resize', () => { initRain(); initNeon(); });
</script>
</body>
</html>
