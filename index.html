<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Internet Laboratory</title>
  <style>
    @font-face {
      font-family: 'Nabla';
      src: url('assets/fonts/nabla.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Walter Turncoat';
      src: url('assets/fonts/walter-turncoat.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Pangolin';
      src: url('assets/fonts/pangolin.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #eef0f4;
      --surface:    #e4e7ed;
      --border:     #cdd1da;
      --border-hi:  #b4bac7;
      --text:       #0f1318;
      --text-dim:   #7a8494;
      --text-mid:   #4a5464;
      --accent:     #5a7a5a;
      --accent-dim: rgba(90,122,90,0.07);
      --accent-glow:rgba(90,122,90,0.16);
      --font-display: "Nabla", system-ui;
      --font-body: "Pangolin", cursive;
      --font-sub: "Walter Turncoat", cursive;
      --entrance-bg: #d8dce6;
    }

    #entrance.dark-mode {
      --bg:         #121418;
      --surface:    #1a1e24;
      --border:     #2b313a;
      --border-hi:  #3b4352;
      --text:       #eef0f4;
      --text-dim:   #646f80;
      --text-mid:   #8a95a5;
      --accent:     #7aaa7a;
      --entrance-bg: #16191f;
    }

    #entrance.alt-font {
      --font-body: monospace;
      --font-sub: monospace;
      letter-spacing: 0.05em;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      overflow: hidden;
    }

    @font-palette-values --nabla-blue {
      font-family: 'Nabla';
      override-colors:
        0 #a85c45, 1 #8a4733, 2 #b8913a, 3 #6b3a28,
        4 #4a2418, 5 #f2dbc8, 6 #e8c49a;
    }

    #cursor {
      display: none;
      position: fixed;
      width: 8px; height: 8px;
      background: var(--accent);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: transform 0.08s, width 0.15s, height 0.15s, opacity 0.15s;
      mix-blend-mode: multiply;
    }
    #cursor.big {
      width: 32px; height: 32px;
      background: transparent;
      border: 1px solid var(--accent);
    }
    @media (hover: hover) and (pointer: fine) {
      #cursor { display: block; }
      body { cursor: none; }
    }

    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 9000; opacity: 0.6;
    }

    body::after {
      content: ''; position: fixed; inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.015) 2px, rgba(0,0,0,0.015) 4px);
      pointer-events: none; z-index: 8999;
    }

    #entrance {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 100;
      background: var(--entrance-bg); overflow: hidden;
      color: var(--text); font-family: var(--font-body);
      transition: opacity 0.6s ease, transform 0.6s ease, background 0.3s ease;
    }

    .chaos-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

    .speech-bubble {
      position: absolute; top: 12%; left: -20%; transform: rotate(-12deg);
      font-family: var(--font-sub); font-size: 0.75rem; color: var(--text-mid);
      background: rgba(255,255,255,0.65); border: 1px solid var(--border);
      padding: 0.6rem 0.9rem; max-width: 240px; box-shadow: 6px 10px 24px rgba(0,0,0,0.08);
      animation: bubbleDrift 10s ease-in-out infinite;
    }

    #entrance.dark-mode .speech-bubble { background: rgba(40, 45, 55, 0.75); }

    .marquee {
      position: absolute; bottom: 18%; left: 0; width: 200%; display: flex; gap: 3rem;
      font-family: var(--font-body); font-size: 0.7rem; color: var(--text-dim); opacity: 0.7;
      animation: marqueeMove 14s linear infinite;
    }

    .toggle-panel {
      position: absolute; right: 8%; top: 22%; display: flex; flex-direction: column;
      gap: 0.6rem; pointer-events: auto;
    }

    .fake-toggle {
      width: 42px; height: 22px; border: 1px solid var(--border-hi);
      background: rgba(255,255,255,0.4); position: relative; cursor: pointer;
    }
    #entrance.dark-mode .fake-toggle { background: rgba(0,0,0,0.4); }
    .fake-toggle::after {
      content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 16px;
      background: #999; transition: transform 0.25s ease, background-color 0.25s ease;
    }
    .fake-toggle.active::after { transform: translateX(18px); background: var(--accent); }

    .rope {
      position: absolute; top: 0; left: calc(50% - 25px); width: 50px; height: 140px;
      transform-origin: 25px top; animation: ropeSwing 3.8s ease-in-out infinite;
      pointer-events: auto; cursor: grab; z-index: 10;
    }
    .rope::before {
      content: ''; position: absolute; top: 0; left: 24px; width: 2px; height: 100%;
      background: rgba(0,0,0,0.25);
    }
    #entrance.dark-mode .rope::before { background: rgba(255,255,255,0.3); }
    .rope:active { cursor: grabbing; }
    .rope.dragging { animation: none !important; }
    .rope::after {
      content: ''; position: absolute; bottom: 0; left: 25px; transform: translateX(-50%);
      width: 14px; height: 14px; border-radius: 50%; background: var(--accent);
      box-shadow: 0 0 18px var(--accent-glow);
    }

    #entrance::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.35), transparent 60%);
      backdrop-filter: blur(10px); opacity: 0.5; pointer-events: none;
      animation: liquidShift 8s ease-in-out infinite;
    }

    @keyframes bubbleDrift {
      0% { transform: translateX(-25%) rotate(-12deg); opacity: 0; }
      15% { opacity: 1; }
      50% { transform: translateX(20%) rotate(-9deg); }
      85% { opacity: 1; }
      100% { transform: translateX(120%) rotate(-14deg); opacity: 0; }
    }
    @keyframes marqueeMove { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    @keyframes ropeSwing { 0% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } 100% { transform: rotate(-6deg); } }
    @keyframes liquidShift { 0% { transform: scale(1) translateY(0); } 50% { transform: scale(1.05) translateY(-6px); } 100% { transform: scale(1) translateY(0); } }

    .entrance-inner {
      display: flex; flex-direction: column; align-items: center; gap: 0;
      opacity: 0; animation: fadeUp 1s ease 0.3s forwards; z-index: 20;
    }

    .main-title {
      font-family: var(--font-display); font-size: clamp(2.2rem, 7vw, 5.5rem);
      font-weight: 400; letter-spacing: 0.01em; line-height: 1.1; text-align: center;
      color: var(--text); font-palette: --nabla-blue; font-optical-sizing: auto;
      font-variation-settings: "EDPT" 100, "EHLT" 12; position: relative;
    }

    .enter-btn {
      margin-top: 3rem; display: inline-flex; align-items: center; gap: 0.9rem;
      padding: 1rem 2.8rem; max-width: 280px; border: 2px solid #a85c45;
      box-shadow: 0 0 0 4px rgba(168,92,69,0.22), 0 4px 0 #6b3a28, 0 6px 12px rgba(107,58,40,0.35);
      background: #a85c45; color: #fdf8f0; outline: none;
      font-family: var(--font-sub); font-size: 0.9rem; font-weight: 400;
      letter-spacing: 0.15em; text-transform: uppercase; cursor: none;
      position: relative; overflow: hidden;
      transition: box-shadow 0.08s, transform 0.08s, background 0.12s, opacity 0.2s, filter 0.2s;
    }
    .enter-btn::before {
      content: ''; position: absolute; inset: 0;
      background: repeating-linear-gradient(45deg, transparent, transparent 6px, rgba(253,248,240,0.06) 6px, rgba(253,248,240,0.06) 12px);
      pointer-events: none;
    }
    .enter-btn:hover:not(:disabled) { background: #b86b52; box-shadow: 0 4px 0 #6b3a28, 0 8px 18px rgba(107,58,40,0.45); }
    .enter-btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #6b3a28, 0 3px 8px rgba(107,58,40,0.3); }
    .enter-btn:focus-visible { outline: 2px solid #f2dbc8; outline-offset: 4px; }
    .enter-btn:hover:not(:disabled) .btn-arrow { transform: translateX(5px); }
    .btn-arrow { transition: transform 0.15s ease; font-style: normal; }
    .enter-btn:disabled { filter: grayscale(1) contrast(0.8); opacity: 0.35; cursor: not-allowed; box-shadow: 0 4px 0 #555; }

    .coords {
      position: fixed; bottom: 1.5rem; left: 0; right: 0;
      font-family: var(--font-body); font-size: 0.58rem; font-weight: 300;
      color: var(--text-dim); letter-spacing: 0.15em; opacity: 0;
      animation: fadeUp 1s ease 1.2s forwards; text-align: center; white-space: nowrap;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── GLITCH EXIT ANIMATION ── */
    body.glitch-out {
      animation: criticalGlitch 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      pointer-events: none;
    }

    @keyframes criticalGlitch {
      0%   { filter: invert(0) contrast(1); transform: translate(0, 0) skew(0deg); }
      20%  { filter: invert(1) contrast(2) drop-shadow(4px 0px 0 red) drop-shadow(-4px 0px 0 blue); transform: translate(-8px, 8px) skew(15deg); }
      40%  { filter: invert(0) contrast(1.5) drop-shadow(-4px 0px 0 red); transform: translate(8px, -8px) skew(-15deg); }
      60%  { filter: invert(1) contrast(3); transform: translate(-12px, 12px) skew(25deg); background: #000; }
      80%  { filter: hue-rotate(90deg) saturate(5); transform: translate(5px, -5px) skew(-5deg); }
      100% { filter: invert(1) brightness(0); transform: translate(0, 0) scale(1.1); opacity: 0; }
    }
  </style>
</head>
<body>

  <div id="cursor"></div>

  <div id="entrance">
    <div class="chaos-layer">
      <div class="rope" id="pullCord"></div>
      <div class="speech-bubble">
        “this interface is not stable but it is enthusiastic”
      </div>
      <div class="toggle-panel">
        <div class="fake-toggle" id="toggleLock" title="System Authorization Switch"></div>
        <div class="fake-toggle" id="toggleFont" title="Typography Mutation Switch"></div>
        <div class="fake-toggle" id="toggleTicker" title="Ticker Stream Inversion Switch"></div>
      </div>
      <div class="marquee" id="entranceMarquee">
        <span>LAB INITIALISING</span>
        <span>EXPECT NOTHING</span>
        <span>EXPECT TOO MUCH</span>
        <span>INTERFACE BREATHING</span>
        <span>LAB INITIALISING</span>
        <span>EXPECT NOTHING</span>
        <span>EXPECT TOO MUCH</span>
      </div>
    </div>

    <div class="entrance-inner">
      <h1 class="main-title">The Internet Laboratory</h1>
      <button id="enterBtn" class="enter-btn" type="button" disabled>
        ENTER <span class="btn-arrow">→</span>
      </button>
    </div>
    <div id="coordText" class="coords"></div>
  </div>

  <script>
    const cursor = document.getElementById('cursor');
    const coordText = document.getElementById('coordText');
    const entrance = document.getElementById('entrance');
    const enterBtn = document.getElementById('enterBtn');
    const pullCord = document.getElementById('pullCord');
    const toggleLock = document.getElementById('toggleLock');
    const toggleFont = document.getElementById('toggleFont');
    const toggleTicker = document.getElementById('toggleTicker');
    const entranceMarquee = document.getElementById('entranceMarquee');

    document.addEventListener('mousemove', e => {
      if (cursor) { cursor.style.left = e.clientX+'px'; cursor.style.top = e.clientY+'px'; }
    });
    
    document.querySelectorAll('button, .fake-toggle, .rope').forEach(el => {
      el.addEventListener('mouseenter', e => { if (cursor && !e.target.disabled) cursor.classList.add('big'); });
      el.addEventListener('mouseleave', () => { if (cursor) cursor.classList.remove('big'); });
    });

    const diagnostics = [
      'SECTION COUNT: 08 — stable (emotionally unstable)',
      'EXPERIMENT STATUS: behaving as expected-ish',
      'TRAPS ARMED: yes but legally we cannot confirm why',
      'GAMES RUNNING: rules optional, enthusiasm required',
      'CONTAINMENT: loosely conceptual at best',
      'ANOMALY DETECTED: promoted to feature',
      'GENERATORS GENERATING: slightly too confidently',
      'MACHINES: humming in a suspiciously satisfied way',
      'PURPOSE: not found, replaced with curiosity',
      'OPERATOR MOOD: caffeinated curiosity',
      'EXIT STRATEGY: available but discouraged for morale reasons',
      'IS THIS FINE: define “fine”',
      'LAST BACKUP: emotionally remembered only',
      'WARNING COUNT: 3.7 (rounded down for safety)',
      'NOTE: the lab appreciates your continued participation',
    ];
    
    let diagIndex = 0;
    if (coordText) {
      coordText.textContent = diagnostics[0];
      coordText.style.transition = 'opacity 0.3s ease';
    }
    let coordInterval = setInterval(() => {
      if (!coordText) return;
      diagIndex = (diagIndex + 1) % diagnostics.length;
      coordText.style.opacity = '0';
      setTimeout(() => { coordText.textContent = diagnostics[diagIndex]; coordText.style.opacity = '1'; }, 300);
    }, 2800);

    let isDraggingCord = false, dragStartY = 0, cordLengthDelta = 0;
    const maxCordPull = 80, switchTriggerDelta = 45; 

    function startCordDrag(e) {
      isDraggingCord = true; pullCord.classList.add('dragging');
      dragStartY = e.touches ? e.touches[0].clientY : e.clientY;
      pullCord.style.transition = 'none';
    }
    function continuousCordDrag(e) {
      if (!isDraggingCord) return;
      if (e.cancelable) e.preventDefault(); 
      const currentY = e.touches ? e.touches[0].clientY : e.clientY;
      let calculatedPull = currentY - dragStartY;
      if (calculatedPull < 0) calculatedPull = 0;
      if (calculatedPull > maxCordPull) calculatedPull = maxCordPull;
      cordLengthDelta = calculatedPull;
      pullCord.style.height = `${140 + cordLengthDelta}px`;
    }
    function endCordDrag() {
      if (!isDraggingCord) return;
      isDraggingCord = false; pullCord.classList.remove('dragging');
      pullCord.style.transition = 'height 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.25)';
      pullCord.style.height = '';
      if (cordLengthDelta >= switchTriggerDelta) entrance.classList.toggle('dark-mode');
      cordLengthDelta = 0;
    }

    pullCord.addEventListener('mousedown', startCordDrag);
    pullCord.addEventListener('touchstart', startCordDrag, { passive: true });
    window.addEventListener('mousemove', continuousCordDrag);
    window.addEventListener('touchmove', continuousCordDrag, { passive: false });
    window.addEventListener('mouseup', endCordDrag);
    window.addEventListener('touchend', endCordDrag);

    toggleLock.addEventListener('click', () => {
      toggleLock.classList.toggle('active');
      enterBtn.disabled = !toggleLock.classList.contains('active');
    });

    toggleFont.addEventListener('click', () => {
      toggleFont.classList.toggle('active');
      entrance.classList.toggle('alt-font');
    });

    toggleTicker.addEventListener('click', () => {
      toggleTicker.classList.toggle('active');
      entranceMarquee.style.animationDirection = toggleTicker.classList.contains('active') ? 'reverse' : 'normal';
    });

    // Handle Glitch Exit
    enterBtn.addEventListener('click', () => {
      if (enterBtn.disabled) return;
      document.body.classList.add('glitch-out');
      setTimeout(() => {
        window.location.href = 'lab.html';
      }, 400); 
    });
  </script>
</body>
</html>
